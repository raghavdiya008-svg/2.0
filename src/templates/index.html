<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.0 — Autonomous Viral Video Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2563eb',
                        accentHover: '#3b82f6',
                        darkBg: '#090d16',
                        cardBg: '#0f172a',
                        borderBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- React and ReactDOM UMD -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons Vanilla UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .canvas-container { width: 100% !important; height: 100% !important; max-width: 360px !important; aspect-ratio: 9/16 !important; margin: 0 auto !important; }
        .lower-canvas, .upper-canvas { width: 100% !important; height: 100% !important; object-fit: contain !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-[#090d16] text-zinc-100 min-h-screen overflow-x-hidden flex flex-col selection:bg-blue-600 selection:text-white font-sans">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Icon wrapper to integrate vanilla Lucide icons cleanly inside React virtual DOM
        const Icon = React.memo(({ name, className = "w-5 h-5" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className;
                    ref.current.appendChild(i);
                    window.lucide.createIcons();
                }
            }, [name, className]);

            return <span ref={ref} className="inline-flex items-center justify-center pointer-events-none" />;
        });

        // -------------------------------------------------------------------
        // Main Application Component
        // -------------------------------------------------------------------
        function App() {
            const [activeTab, setActiveTab] = useState('pipeline'); // 'pipeline' | 'canvas'

            // Dependencies State
            const [depsStatus, setDepsStatus] = useState(null);
            const [isCheckingDeps, setIsCheckingDeps] = useState(false);
            const [isInstallingDeps, setIsInstallingDeps] = useState(false);

            // Asset State
            const [videos, setVideos] = useState([]);
            const [logos, setLogos] = useState([]);
            const [selectedVideo, setSelectedVideo] = useState('');
            const [selectedLogo, setSelectedLogo] = useState('');
            const [remoteUrl, setRemoteUrl] = useState('');
            
            // Ingestion & Audio MD5 Cache State
            const [ingestData, setIngestData] = useState(null);
            const [isIngesting, setIsIngesting] = useState(false);

            // Loading Console State
            const [processId, setProcessId] = useState('');
            const [consoleLogs, setConsoleLogs] = useState([]);
            const [pipelineStage, setPipelineStage] = useState('idle');
            const [pipelineProgress, setPipelineProgress] = useState(0);

            // Curation State
            const [curatedClips, setCuratedClips] = useState([]);
            const [selectedClipIndices, setSelectedClipIndices] = useState([]);
            const [targetClipsCount, setTargetClipsCount] = useState(0);
            const [lowYieldWarning, setLowYieldWarning] = useState(false);
            const [yieldMessage, setYieldMessage] = useState('');
            const [isCurating, setIsCurating] = useState(false);

            // Batch Render State
            const [batchId, setBatchId] = useState('');
            const [batchStatus, setBatchStatus] = useState(null);
            const [isRenderingBatch, setIsRenderingBatch] = useState(false);
            const [renderSpeed, setRenderSpeed] = useState(1.10);
            const [globalTitleY, setGlobalTitleY] = useState(130);
            const [globalMarginV, setGlobalMarginV] = useState(960);

            // Virtual TV Director Preview & Reviewer State
            const [previewModalOpen, setPreviewModalOpen] = useState(false);
            const [previewClip, setPreviewClip] = useState(null);
            const [previewClipIndex, setPreviewClipIndex] = useState(null);
            const [previewShots, setPreviewShots] = useState([]);
            const [isLoadingDirector, setIsLoadingDirector] = useState(false);
            const [renderedClipResult, setRenderedClipResult] = useState(null);
            const [isRenderingSingle, setIsRenderingSingle] = useState(false);

            // Gemini Batch Importer State
            const [importModalOpen, setImportModalOpen] = useState(false);
            const [importRawText, setImportRawText] = useState('');
            const [importAppendMode, setImportAppendMode] = useState(true);
            const [importError, setImportError] = useState('');

            // Fetch available assets and check dependencies on mount
            useEffect(() => {
                fetchAssets();
                checkDependencies(false);
            }, []);

            // Polling for Loading Console progress
            useEffect(() => {
                if (!processId || (!isIngesting && !isCurating)) return;
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/progress/${processId}`);
                        if (res.ok) {
                            const data = await res.json();
                            setConsoleLogs(data.logs || []);
                            setPipelineStage(data.stage || 'running');
                            setPipelineProgress(data.progress_pct || 0);
                            if (data.is_done) {
                                clearInterval(interval);
                            }
                        }
                    } catch (err) {
                        console.error("Progress poll error:", err);
                    }
                }, 700);
                return () => clearInterval(interval);
            }, [processId, isIngesting, isCurating]);

            // Polling for Batch Render progress
            useEffect(() => {
                if (!batchId || !isRenderingBatch) return;
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/batch_status/${batchId}`);
                        if (res.ok) {
                            const data = await res.json();
                            setBatchStatus(data);
                            if (data.status === 'completed' || data.status === 'failed') {
                                setIsRenderingBatch(false);
                                clearInterval(interval);
                            }
                        }
                    } catch (err) {
                        console.error("Batch poll error:", err);
                    }
                }, 1500);
                return () => clearInterval(interval);
            }, [batchId, isRenderingBatch]);

            const fetchAssets = async () => {
                try {
                    const res = await fetch('/list_assets');
                    if (res.ok) {
                        const data = await res.json();
                        setVideos(data.videos || []);
                        setLogos(data.logos || []);
                        if (data.videos && data.videos.length > 0 && !selectedVideo) {
                            setSelectedVideo(data.videos[0]);
                        }
                    }
                } catch (e) {
                    console.error("Failed to fetch assets:", e);
                }
            };

            const checkDependencies = async (autoInstall = false) => {
                if (autoInstall) {
                    setIsInstallingDeps(true);
                    setConsoleLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] Initiating ECC dependency installation stream...`]);
                    setPipelineStage('dependencies');
                    setPipelineProgress(10);
                    try {
                        const eventSource = new EventSource('/api/dependencies/stream');
                        eventSource.onmessage = (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                if (data.output) {
                                    setConsoleLogs(prev => [...prev, data.output]);
                                } else if (data.message) {
                                    setConsoleLogs(prev => [...prev, `[DEPS] ${data.message}`]);
                                }
                                if (data.done) {
                                    eventSource.close();
                                    setIsInstallingDeps(false);
                                    setPipelineProgress(100);
                                    // Refresh status map
                                    fetch('/api/check_dependencies', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ auto_install: false })
                                    }).then(r => r.json()).then(setDepsStatus);
                                }
                            } catch (err) {
                                console.error("Error parsing dependency stream:", err);
                            }
                        };
                        eventSource.onerror = () => {
                            eventSource.close();
                            setIsInstallingDeps(false);
                        };
                    } catch (e) {
                        console.error("Stream connection error:", e);
                        setIsInstallingDeps(false);
                    }
                } else {
                    setIsCheckingDeps(true);
                    try {
                        const res = await fetch('/api/check_dependencies', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ auto_install: false })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setDepsStatus(data);
                        }
                    } catch (e) {
                        console.error("Check dependencies error:", e);
                    } finally {
                        setIsCheckingDeps(false);
                    }
                }
            };

            const handleIngestAndCurate = async () => {
                const pid = 'p_' + Math.random().toString(36).substring(2, 9);
                setProcessId(pid);
                setConsoleLogs([`[${new Date().toLocaleTimeString()}] Initializing 2.0 Video Ingestion & Intelligence...`]);
                setPipelineProgress(5);
                setPipelineStage('ingestion');
                setIsIngesting(true);
                setCuratedClips([]);
                setSelectedClipIndices([]);
                setLowYieldWarning(false);
                setBatchStatus(null);
                setBatchId('');

                const parseResponseError = async (res) => {
                    try {
                        const text = await res.text();
                        try {
                            const parsed = JSON.parse(text);
                            return parsed.detail || parsed.message || text;
                        } catch {
                            return text.length > 300 ? text.slice(0, 300) + '...' : text;
                        }
                    } catch {
                        return res.statusText || 'Request failed';
                    }
                };

                const pollUntilDone = (taskPid, stageName) => {
                    return new Promise((resolve, reject) => {
                        const timer = setInterval(async () => {
                            try {
                                const res = await fetch(`/api/progress/${taskPid}`);
                                if (!res.ok) return;
                                const data = await res.json();
                                if (data.logs && data.logs.length > 0) {
                                    setConsoleLogs(data.logs);
                                }
                                if (data.stage) setPipelineStage(data.stage);
                                if (typeof data.progress_pct === 'number') setPipelineProgress(data.progress_pct);

                                if (data.error) {
                                    clearInterval(timer);
                                    reject(new Error(data.error));
                                } else if (data.is_done) {
                                    clearInterval(timer);
                                    resolve(data.result);
                                }
                            } catch (e) {
                                console.error(`Error polling ${stageName}:`, e);
                            }
                        }, 1000);
                    });
                };

                try {
                    // Step 1: Ingest (URL or local video) via async background task
                    const ingestPayload = remoteUrl.trim()
                        ? { url: remoteUrl.trim(), process_id: pid, async_mode: true }
                        : { file_name: selectedVideo, process_id: pid, async_mode: true };

                    const ingestRes = await fetch('/api/ingest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(ingestPayload)
                    });

                    if (!ingestRes.ok) {
                        const errDetail = await parseResponseError(ingestRes);
                        throw new Error(errDetail);
                    }

                    const ingestDataInitial = await ingestRes.json();
                    let ingestResult = ingestDataInitial;
                    if (ingestDataInitial.status === 'queued') {
                        ingestResult = await pollUntilDone(pid, 'ingestion');
                    }

                    if (!ingestResult) {
                        throw new Error('Ingestion completed without returning file metadata.');
                    }

                    setIngestData(ingestResult);
                    if (ingestResult.file_name) {
                        setSelectedVideo(ingestResult.file_name);
                    }
                    fetchAssets(); // Refresh video list
                    setIsIngesting(false);

                    // Step 2: High-Volume Curation Engine via async background task
                    setIsCurating(true);
                    setPipelineStage('curation');

                    const curatePid = 'c_' + Math.random().toString(36).substring(2, 9);
                    setProcessId(curatePid);

                    const curateRes = await fetch('/api/curate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: ingestResult.file_name || selectedVideo,
                            audio_md5: ingestResult.audio_md5 || null,
                            process_id: curatePid,
                            min_score: 75,
                            async_mode: true
                        })
                    });

                    if (!curateRes.ok) {
                        const errDetail = await parseResponseError(curateRes);
                        throw new Error(errDetail);
                    }

                    const curateDataInitial = await curateRes.json();
                    let curateResult = curateDataInitial;
                    if (curateDataInitial.status === 'queued') {
                        curateResult = await pollUntilDone(curatePid, 'curation');
                    }

                    if (!curateResult) {
                        throw new Error('Curation completed without returning clip data.');
                    }

                    setCuratedClips(curateResult.clips || []);
                    setTargetClipsCount(curateResult.target_clips || 0);
                    setLowYieldWarning(curateResult.low_yield_warning || false);
                    setYieldMessage(curateResult.message || '');

                    // Auto-select Top 5 by default
                    const topIndices = (curateResult.clips || []).slice(0, 5).map((_, i) => i);
                    setSelectedClipIndices(topIndices);

                } catch (err) {
                    setConsoleLogs(prev => [...prev, `[ERROR] ${err.message}`]);
                    setPipelineStage('error');
                } finally {
                    setIsIngesting(false);
                    setIsCurating(false);
                }
            };

            const toggleClipSelection = (index) => {
                setSelectedClipIndices(prev => 
                    prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]
                );
            };

            const selectTopN = (n) => {
                const top = curatedClips.slice(0, n).map((_, i) => i);
                setSelectedClipIndices(top);
            };

            const selectHighVirality = (minScore = 80) => {
                const indices = [];
                curatedClips.forEach((c, i) => {
                    if ((c.virality_score || 0) >= minScore) indices.push(i);
                });
                setSelectedClipIndices(indices);
            };

            const parseAndImportGeminiBatch = () => {
                setImportError('');
                const raw = (importRawText || '').trim();
                if (!raw) {
                    setImportError('Please paste Gemini JSON or timestamp lines.');
                    return;
                }

                let newClips = [];

                // Try 1: Strict or Lenient JSON parsing
                try {
                    // Extract JSON array if surrounded by markdown code blocks or text
                    let jsonText = raw;
                    const jsonMatch = raw.match(/\[\s*\{[\s\S]*\}\s*\]/);
                    if (jsonMatch) {
                        jsonText = jsonMatch[0];
                    }
                    const parsed = JSON.parse(jsonText);
                    if (Array.isArray(parsed)) {
                        newClips = parsed.map((item, idx) => {
                            const start = parseFloat(item.start ?? item.start_time ?? 0);
                            const end = parseFloat(item.end ?? item.end_time ?? (start + 40));
                            return {
                                start: Math.max(0, start),
                                end: Math.max(start + 5, end),
                                virality_score: parseInt(item.virality_score ?? item.score ?? 90, 10),
                                title: item.title || item.hook_sentence || `Gemini Hook #${idx + 1}`,
                                hook_sentence: item.title || item.hook_sentence || `Gemini Hook #${idx + 1}`,
                                reason: item.reason || item.hook_summary || item.virality_reason || 'Curated high-retention moment by Gemini.',
                                is_gemini_imported: true
                            };
                        });
                    }
                } catch (e) {
                    // Try 2: Plain text regex parsing for timestamps like "04:15 - 04:55 | Title" or "1. [12:30 - 13:10] Title"
                    const lines = raw.split('\n');
                    const timeRegex = /(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\s*(?:-|to|–)\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})/i;

                    const parseToSeconds = (h, m, s) => {
                        return (parseInt(h || '0', 10) * 3600) + (parseInt(m, 10) * 60) + parseInt(s, 10);
                    };

                    lines.forEach((line, idx) => {
                        const match = line.match(timeRegex);
                        if (match) {
                            const startSec = parseToSeconds(match[1], match[2], match[3]);
                            const endSec = parseToSeconds(match[4], match[5], match[6]);
                            if (endSec > startSec) {
                                // Extract remaining text as title
                                let titleClean = line.replace(match[0], '')
                                    .replace(/^[0-9]+[.)\]]\s*/, '')
                                    .replace(/^[\s|\-–:\[\]]+/, '')
                                    .replace(/[\s|\[\]]+$/, '')
                                    .trim();
                                if (!titleClean) titleClean = `Gemini Hook #${idx + 1}`;

                                newClips.push({
                                    start: startSec,
                                    end: endSec,
                                    virality_score: 90,
                                    title: titleClean,
                                    hook_sentence: titleClean,
                                    reason: 'Curated high-retention moment by Gemini.',
                                    is_gemini_imported: true
                                });
                            }
                        }
                    });
                }

                if (newClips.length === 0) {
                    setImportError('Could not find valid timestamps. Format as JSON or lines like "04:15 - 04:55 | Title".');
                    return;
                }

                setCuratedClips(prev => {
                    const combined = importAppendMode ? [...prev, ...newClips] : newClips;
                    return combined;
                });

                // Auto-select the imported clips
                setSelectedClipIndices(prev => {
                    if (importAppendMode) {
                        const startIdx = curatedClips.length;
                        const addedIndices = newClips.map((_, i) => startIdx + i);
                        return [...prev, ...addedIndices];
                    } else {
                        return newClips.map((_, i) => i);
                    }
                });

                setLowYieldWarning(false);
                setYieldMessage(`Loaded ${newClips.length} Gemini clip(s) successfully.`);
                setImportRawText('');
                setImportModalOpen(false);
            };

            const updateClipTime = (index, field, value) => {
                setCuratedClips(prev => {
                    const next = [...prev];
                    const clip = { ...next[index] };
                    clip[field] = Math.max(0, value);
                    clip[`${field}_time`] = clip[field];
                    next[index] = clip;
                    return next;
                });
            };

            const handleStartBatchRender = async () => {
                if (selectedClipIndices.length === 0) return;
                const clipsToRender = selectedClipIndices.map(i => curatedClips[i]);
                setIsRenderingBatch(true);

                try {
                    const res = await fetch('/api/render_batch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: selectedVideo,
                            clips: clipsToRender,
                            speed: renderSpeed || 1.10,
                            watermark_logo: selectedLogo || null,
                            brand_logo: selectedLogo || null,
                            aspect_ratio: '9:16',
                            title_y: globalTitleY,
                            margin_v: globalMarginV,
                            audio_md5: (ingestData && ingestData.audio_md5) ? ingestData.audio_md5 : null
                        })
                    });

                    if (!res.ok) {
                        let errDetail = 'Batch submission failed';
                        try {
                            const text = await res.text();
                            try {
                                const parsed = JSON.parse(text);
                                errDetail = parsed.detail || parsed.message || text;
                            } catch {
                                errDetail = text.slice(0, 200) || errDetail;
                            }
                        } catch {}
                        throw new Error(errDetail);
                    }

                    const data = await res.json();
                    setBatchId(data.batch_id);
                } catch (err) {
                    alert(`Batch Render Error: ${err.message}`);
                    setIsRenderingBatch(false);
                }
            };

            const openDirectorPreview = async (clip, index) => {
                setPreviewClip({ ...clip });
                setPreviewClipIndex(index);
                setPreviewModalOpen(true);
                setRenderedClipResult(null);
                setIsLoadingDirector(true);
                try {
                    const words = clip.words || (ingestData?.transcript?.words || []);
                    const res = await fetch('/api/director/plan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: selectedVideo,
                            start: clip.start,
                            end: clip.end,
                            words: words,
                            use_ollama: true
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setPreviewShots(data.shots || []);
                    }
                } catch (e) {
                    console.error("Director plan fetch error:", e);
                } finally {
                    setIsLoadingDirector(false);
                }
            };

            const handleUpdatePreviewClip = (field, value) => {
                setPreviewClip(prev => {
                    if (!prev) return null;
                    const updated = { ...prev, [field]: value };
                    if (previewClipIndex !== null) {
                        setCuratedClips(clips => {
                            const copy = [...clips];
                            copy[previewClipIndex] = { ...copy[previewClipIndex], [field]: value };
                            return copy;
                        });
                    }
                    return updated;
                });
            };

            const handleRenderApprovedClip = async (extraParams = {}) => {
                if (!previewClip || !selectedVideo) return;
                setIsRenderingSingle(true);
                setRenderedClipResult(null);
                try {
                    const words = previewClip.words || (ingestData?.transcript?.words || []);
                    const isDualShot = previewShots && previewShots.some(s => s.type === 'split_stack');
                    const payload = {
                        video: selectedVideo,
                        start: previewClip.start,
                        end: previewClip.end,
                        headline_text: extraParams.delete_title ? '' : (previewClip.hook_sentence || previewClip.title || ''),
                        speed: renderSpeed || 1.10,
                        speed_factor: renderSpeed || 1.10,
                        title_y: extraParams.title_y || previewClip.title_y || 130,
                        margin_v: extraParams.margin_v || previewClip.margin_v || (isDualShot ? 960 : 580),
                        delete_title: Boolean(extraParams.delete_title),
                        trajectory: {
                            layout: 'director_multizone',
                            shot_timeline: previewShots
                        },
                        words: words
                    };
                    const res = await fetch('/render', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const jobId = data.job_id;
                        const pollInterval = setInterval(async () => {
                            try {
                                const sRes = await fetch(`/api/status/${jobId}`);
                                if (sRes.ok) {
                                    const sData = await sRes.json();
                                    if (sData.status === 'completed') {
                                        clearInterval(pollInterval);
                                        setIsRenderingSingle(false);
                                        setRenderedClipResult(sData);
                                    } else if (sData.status === 'failed') {
                                        clearInterval(pollInterval);
                                        setIsRenderingSingle(false);
                                        alert(`Render failed: ${sData.error || 'Unknown error'}`);
                                    }
                                }
                            } catch (pollErr) {
                                console.error("Poll error:", pollErr);
                            }
                        }, 1000);
                    } else {
                        setIsRenderingSingle(false);
                    }
                } catch (e) {
                    setIsRenderingSingle(false);
                    console.error("Render approved clip error:", e);
                }
            };

            return (
                <div className="min-h-screen w-full flex flex-col bg-[#090d16] text-white">
                    {/* Header Navbar */}
                    <header className="h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-xl tracking-tighter shadow-lg shadow-blue-500/20">
                                2.0
                            </div>
                            <div>
                                <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-2">
                                    Video Pipeline
                                    <span className="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                        Autonomous Studio
                                    </span>
                                </h1>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                            <button
                                onClick={() => setActiveTab('pipeline')}
                                className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                                    activeTab === 'pipeline' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-400 hover:text-white'
                                }`}

        // -------------------------------------------------------------------

        function PipelineTabContent({

            selectTopN, selectHighVirality,
            targetClipsCount, lowYieldWarning, yieldMessage,
            renderSpeed, setRenderSpeed,
            handleStartBatchRender, isRenderingBatch, batchStatus, batchId,

            onOpenDirectorPreview, onOpenImportModal,

            const consoleBottomRef = useRef(null);

            useEffect(() => {

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                                <p className="text-[11px] text-slate-500">Auto-downloaded via yt-dlp / gdown</p>

                                    {videos.map(v => (

                                        <span className="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                                        <span className="w-3 h-3 rounded-full bg-green-500/80"></span>

                                </div>

                                                                    onClick={() => updateClipTime(index, 'start', Math.min(clip.end - 5, clip.start + 1.0))}

        // -------------------------------------------------------------------
        // Human-in-the-Loop Camera Zones Studio Component
        // -------------------------------------------------------------------
        function CameraFramingStudioTabContent({ videos, selectedVideo, setSelectedVideo }) {
            const [activeVideo, setActiveVideo] = useState(selectedVideo || (videos.length > 0 ? videos[0] : ''));
            const [zones, setZones] = useState([]);
            const [mode, setMode] = useState('podcast');
            const [splitPreference, setSplitPreference] = useState('split_stack');
            const [selectedZoneId, setSelectedZoneId] = useState(null);
            const [isDetecting, setIsDetecting] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Pro Video Playback & Scrubbing State
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [showLivePreview, setShowLivePreview] = useState(true);
            const videoRef = useRef(null);
            const svgRef = useRef(null);

            // Interactive Drag-to-Select Tool State
            // 'select': move/resize existing | 'draw': drag on video to create new box
            const [activeTool, setActiveTool] = useState('select');
            const [aspectLock, setAspectLock] = useState('9:8'); // '9:8' | '9:16' | '16:9' | 'free'
            const [dragAction, setDragAction] = useState(null);

            useEffect(() => {
                if (!activeVideo) return;
                fetchZones(activeVideo);
            }, [activeVideo]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const fetchZones = async (vName) => {
                try {
                    const res = await fetch(`/api/camera_zones/${encodeURIComponent(vName)}`);
                    if (res.ok) {
                        const data = await res.json();
                        setZones(data.zones || []);
                        setMode(data.mode || 'podcast');
                        setSplitPreference(data.split_preference || 'split_stack');
                        if (data.zones && data.zones.length > 0) {
                            setSelectedZoneId(data.zones[0].id);
                        }
                    }
                } catch (e) {
                    console.error("Failed to load camera zones:", e);
                }
            };

            const handleAutoDetect = async () => {
                if (!activeVideo) return;
                setIsDetecting(true);
                try {
                    const res = await fetch('/api/camera_zones/suggest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ file_name: activeVideo })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setZones(data.zones || []);
                        setMode(data.mode || 'podcast');
                        setSplitPreference(data.split_preference || 'split_stack');
                        if (data.zones && data.zones.length > 0) {
                            setSelectedZoneId(data.zones[0].id);
                        }
                        showToast("Auto-detected camera zones successfully!");
                    }
                } catch (e) {
                    console.error("Auto detect error:", e);
                } finally {
                    setIsDetecting(false);
                }
            };

            const handleSave = async () => {
                if (!activeVideo) return;
                setIsSaving(true);
                try {
                    const res = await fetch('/api/camera_zones/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: activeVideo,
                            source_width: 1920,
                            source_height: 1080,
                            mode: mode,
                            split_preference: splitPreference,
                            zones: zones
                        })
                    });
                    if (res.ok) {
                        showToast("Camera zones saved to vault successfully!");
                    }
                } catch (e) {
                    console.error("Save zones error:", e);
                } finally {
                    setIsSaving(false);
                }
            };

            const updateZone = (id, field, value) => {
                setZones(prev => prev.map(z => {
                    if (z.id !== id) return z;
                    let val = value;
                    if (field === 'width' || field === 'height') {
                        val = Math.max(120, parseInt(value) || 120);
                        val = Math.round(val / 2) * 2;
                    } else if (field === 'x' || field === 'y') {
                        val = Math.max(0, parseInt(value) || 0);
                        val = Math.round(val / 2) * 2;
                    }
                    return { ...z, [field]: val };
                }));
            };

            const deleteZone = (id) => {
                setZones(prev => prev.filter(z => z.id !== id));
                if (selectedZoneId === id) setSelectedZoneId(null);
            };

            // Video Playback Handlers
            const togglePlay = () => {
                if (!videoRef.current) return;
                if (isPlaying) {
                    videoRef.current.pause();
                    setIsPlaying(false);
                } else {
                    videoRef.current.play().catch(e => console.warn(e));
                    setIsPlaying(true);
                }
            };

            const handleTimeUpdate = () => {
                if (!videoRef.current) return;
                setCurrentTime(videoRef.current.currentTime);
            };

            const handleLoadedMetadata = () => {
                if (!videoRef.current) return;
                setDuration(videoRef.current.duration || 0);
            };

            const seekTo = (sec) => {
                if (!videoRef.current) return;
                videoRef.current.currentTime = sec;
                setCurrentTime(sec);
            };

            // Coordinate conversion from browser screen mouse to 1920x1080 SVG viewBox
            const getSvgCoords = (e) => {
                if (!svgRef.current) return { x: 0, y: 0 };
                const rect = svgRef.current.getBoundingClientRect();
                const scaleX = 1920 / rect.width;
                const scaleY = 1080 / rect.height;
                return {
                    x: Math.max(0, Math.min(1920, (e.clientX - rect.left) * scaleX)),
                    y: Math.max(0, Math.min(1080, (e.clientY - rect.top) * scaleY))
                };
            };

            const handleSvgMouseDown = (e) => {
                if (activeTool === 'draw') {
                    const coords = getSvgCoords(e);
                    const newId = `zone_custom_${Date.now().toString().slice(-4)}`;
                    const newZ = {
                        id: newId,
                        label: `Zone ${zones.length + 1}`,
                        x: Math.round(coords.x / 2) * 2,
                        y: Math.round(coords.y / 2) * 2,
                        width: 10,
                        height: 10,
                        speaker_label: null,
                        color: '#3b82f6'
                    };
                    setZones(prev => [...prev, newZ]);
                    setSelectedZoneId(newId);
                    setDragAction({
                        type: 'draw',
                        zoneId: newId,
                        startX: coords.x,
                        startY: coords.y
                    });
                } else if (activeTool === 'select' && e.target === svgRef.current) {
                    setSelectedZoneId(null);
                }
            };

            const handleZoneMouseDown = (e, zone) => {
                if (activeTool === 'draw') return;
                e.stopPropagation();
                setSelectedZoneId(zone.id);
                const coords = getSvgCoords(e);
                setDragAction({
                    type: 'move',
                    zoneId: zone.id,
                    startX: coords.x,
                    startY: coords.y,
                    origX: zone.x,
                    origY: zone.y
                });
            };

            const handleHandleMouseDown = (e, zone, handlePos) => {
                e.stopPropagation();
                const coords = getSvgCoords(e);
                setDragAction({
                    type: 'resize',
                    zoneId: zone.id,
                    handlePos: handlePos,
                    startX: coords.x,
                    startY: coords.y,
                    origX: zone.x,
                    origY: zone.y,
                    origW: zone.width,
                    origH: zone.height
                });
            };

            const handleSvgMouseMove = (e) => {
                if (!dragAction) return;
                const coords = getSvgCoords(e);

                if (dragAction.type === 'draw') {
                    let w = Math.max(40, Math.abs(coords.x - dragAction.startX));
                    let h = Math.max(40, Math.abs(coords.y - dragAction.startY));

                    if (aspectLock === '9:8') {
                        // 9:8 vertical stack zone ratio (width : height = 9 : 8)
                        h = Math.round(w * (8 / 9));
                    } else if (aspectLock === '9:16') {
                        // 9:16 full-screen reel zone ratio (width : height = 9 : 16)
                        h = Math.round(w * (16 / 9));
                    } else if (aspectLock === '16:9') {
                        // 16:9 screen / slide ratio (width : height = 16 : 9)
                        h = Math.round(w * (9 / 16));
                    }

                    // Constrain within 1920x1080 canvas
                    w = Math.min(w, 1920);
                    h = Math.min(h, 1080);

                    const minX = coords.x >= dragAction.startX 
                        ? dragAction.startX 
                        : Math.max(0, dragAction.startX - w);
                    const minY = coords.y >= dragAction.startY 
                        ? dragAction.startY 
                        : Math.max(0, dragAction.startY - h);

                    setZones(prev => prev.map(z => z.id === dragAction.zoneId ? {
                        ...z,
                        x: Math.round(Math.min(minX, 1920 - w) / 2) * 2,
                        y: Math.round(Math.min(minY, 1080 - h) / 2) * 2,
                        width: Math.round(w / 2) * 2,
                        height: Math.round(h / 2) * 2
                    } : z));
                } else if (dragAction.type === 'move') {
                    const dx = coords.x - dragAction.startX;
                    const dy = coords.y - dragAction.startY;
                    const z = zones.find(item => item.id === dragAction.zoneId);
                    if (!z) return;

                    const newX = Math.max(0, Math.min(1920 - z.width, dragAction.origX + dx));
                    const newY = Math.max(0, Math.min(1080 - z.height, dragAction.origY + dy));

                    setZones(prev => prev.map(item => item.id === dragAction.zoneId ? {
                        ...item,
                        x: Math.round(newX / 2) * 2,
                        y: Math.round(newY / 2) * 2
                    } : item));
                } else if (dragAction.type === 'resize') {
                    const dx = coords.x - dragAction.startX;
                    const dy = coords.y - dragAction.startY;
                    const { origX, origY, origW, origH, handlePos } = dragAction;

                    let newX = origX;
                    let newY = origY;
                    let newW = origW;
                    let newH = origH;

                    if (handlePos === 'br') {
                        newW = Math.max(100, Math.min(1920 - origX, origW + dx));
                        newH = Math.max(100, Math.min(1080 - origY, origH + dy));
                    } else if (handlePos === 'bl') {
                        const rightEdge = origX + origW;
                        newX = Math.max(0, Math.min(rightEdge - 100, origX + dx));
                        newW = rightEdge - newX;
                        newH = Math.max(100, Math.min(1080 - origY, origH + dy));
                    } else if (handlePos === 'tr') {
                        const bottomEdge = origY + origH;
                        newY = Math.max(0, Math.min(bottomEdge - 100, origY + dy));
                        newH = bottomEdge - newY;
                        newW = Math.max(100, Math.min(1920 - origX, origW + dx));
                    } else if (handlePos === 'tl') {
                        const rightEdge = origX + origW;
                        const bottomEdge = origY + origH;
                        newX = Math.max(0, Math.min(rightEdge - 100, origX + dx));
                        newW = rightEdge - newX;
                        newY = Math.max(0, Math.min(bottomEdge - 100, origY + dy));
                        newH = bottomEdge - newY;
                    }

                    setZones(prev => prev.map(item => item.id === dragAction.zoneId ? {
                        ...item,
                        x: Math.round(newX / 2) * 2,
                        y: Math.round(newY / 2) * 2,
                        width: Math.round(newW / 2) * 2,
                        height: Math.round(newH / 2) * 2
                    } : item));
                }
            };

            const handleSvgMouseUp = () => {
                if (dragAction) {
                    if (dragAction.type === 'draw') {
                        setActiveTool('select');
                    }
                    setDragAction(null);
                }
            };

            const addPresetZone = (type) => {
                let newZone;
                if (type === 'host') {
                    newZone = {
                        id: `zone_host_${Date.now().toString().slice(-4)}`,
                        label: 'Host (Left)',
                        x: 0, y: 0, width: 960, height: 1080,
                        speaker_label: 'SPEAKER_00', color: '#3b82f6', is_wide: false
                    };
                } else if (type === 'guest') {
                    newZone = {
                        id: `zone_guest_${Date.now().toString().slice(-4)}`,
                        label: 'Guest (Right)',
                        x: 960, y: 0, width: 960, height: 1080,
                        speaker_label: 'SPEAKER_01', color: '#10b981', is_wide: false
                    };
                } else if (type === 'wide') {
                    newZone = {
                        id: `zone_wide_${Date.now().toString().slice(-4)}`,
                        label: 'Wide 2-Shot',
                        x: 0, y: 0, width: 1920, height: 1080,
                        speaker_label: null, color: '#8b5cf6', is_wide: true
                    };
                } else if (type === 'facecam') {
                    newZone = {
                        id: `zone_facecam_${Date.now().toString().slice(-4)}`,
                        label: 'Gaming Facecam',
                        x: 1280, y: 60, width: 600, height: 380,
                        speaker_label: 'SPEAKER_00', color: '#f59e0b', is_facecam: true
                    };
                } else if (type === 'screencast') {
                    newZone = {
                        id: `zone_screencast_${Date.now().toString().slice(-4)}`,
                        label: 'Screencast / Slides',
                        x: 0, y: 0, width: 1920, height: 1080,
                        speaker_label: null, color: '#f59e0b', is_screencast: true
                    };
                }
                if (newZone) {
                    setZones(prev => [...prev, newZone]);
                    setSelectedZoneId(newZone.id);
                }
            };

            const selectedZone = zones.find(z => z.id === selectedZoneId);

            return (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 lg:p-8 space-y-6 shadow-2xl">
                    {/* Header with Title and Global Actions */}
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-800/80">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">HITL Studio</span>
                                <span className="px-2 py-0.5 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-full text-[10px] font-bold">
                                    Virtual TV Director Ready
                                </span>
                            </div>
                            <h2 className="text-2xl font-bold text-white tracking-tight mt-1">
                                Human-in-the-Loop Camera Zones Studio
                            </h2>
                            <p className="text-xs text-slate-400 mt-1">
                                Visually position Host, Guest, Wide, and Facecam boxes once per video. The Ollama Director switches between them seamlessly.
                            </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            {toastMessage && (
                                <div className="px-3 py-1.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold rounded-xl flex items-center gap-1.5 animate-fade-in">
                                    <Icon name="check" className="w-3.5 h-3.5" />
                                    {toastMessage}
                                </div>
