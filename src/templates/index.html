                                                        </div>
                                                        <div>
                                                            <span className="text-[9px] text-slate-500 uppercase">Y</span>
                                                            <input
                                                                type="number"
                                                                value={z.y}
                                                                onChange={(e) => updateZone(z.id, 'y', parseInt(e.target.value) || 0)}
                                                                className="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-center text-slate-300"
                                                            />
                                                        </div>
                                                        <div>
                                                            <span className="text-[9px] text-slate-500 uppercase">W</span>
                                                            <input
                                                                type="number"
                                                                value={z.width}
                                                                onChange={(e) => updateZone(z.id, 'width', parseInt(e.target.value) || 100)}
                                                                className="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-center text-slate-300"
                                                            />
                                                        </div>
                                                        <div>
                                                            <span className="text-[9px] text-slate-500 uppercase">H</span>
                                                            <input
                                                                type="number"
                                                                value={z.height}
                                                                onChange={(e) => updateZone(z.id, 'height', parseInt(e.target.value) || 100)}
                                                                className="w-full bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-center text-slate-300"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <div className="p-3 bg-slate-900/60 border border-slate-800/80 rounded-xl space-y-1.5 text-xs text-slate-400">
                                    <p className="font-semibold text-white flex items-center gap-1.5">
                                        <Icon name="sparkles" className="w-3.5 h-3.5 text-blue-400" />
                                        9:8 Vertical Split-Screen Architecture
                                    </p>
                                    <p className="text-[11px] leading-relaxed">
                                        When both speakers banter or debate, the engine stacks Host on top (1080x960) and Guest on bottom (1080x960), placing kinetic karaoke subtitles cleanly along the center boundary seam.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // -------------------------------------------------------------------
        // Virtual TV Broadcast Director Preview & Reviewer Modal
        // -------------------------------------------------------------------
        function DirectorPreviewModal({
            isOpen, onClose, clip, clipIndex, videoName, shots,
            isLoadingDirector, onUpdateClipField, renderSpeed, setRenderSpeed,
            onRenderApproved, isRenderingSingle, renderedClipResult
        }) {
            const videoRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(clip?.start || 0);

            useEffect(() => {
                if (videoRef.current && clip) {
                    videoRef.current.currentTime = clip.start;
                    setCurrentTime(clip.start);
                }
            }, [clip?.start]);

            const handleTimeUpdate = () => {
                if (!videoRef.current) return;
                const ct = videoRef.current.currentTime;
                setCurrentTime(ct);
                // Loop within clip boundaries
                if (ct >= clip.end) {
                    videoRef.current.currentTime = clip.start;
                }
            };

            const togglePlay = () => {
                if (!videoRef.current) return;
                if (isPlaying) {
                    videoRef.current.pause();
                    setIsPlaying(false);
                } else {
                    videoRef.current.play();
                    setIsPlaying(true);
                }
            };

            const seekTo = (t) => {
                if (!videoRef.current) return;
                videoRef.current.currentTime = t;
                setCurrentTime(t);
            };

            const setInPoint = () => {
                if (!videoRef.current) return;
                const ct = Math.max(0, videoRef.current.currentTime);
                onUpdateClipField('start', ct);
            };

            const setOutPoint = () => {
                if (!videoRef.current) return;
                const ct = Math.min(clip.start + 60, videoRef.current.currentTime);
                if (ct > clip.start) {
                    onUpdateClipField('end', ct);
                }
            };

            // Identify active camera shot at currentTime
            const relTime = Math.max(0, currentTime - clip.start);
            const activeShot = shots.find(s => relTime >= s.start && relTime <= s.end);

            return (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-5xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-scale-in">
                        {/* Modal Header */}
                        <div className="p-6 border-b border-slate-800 flex items-center justify-between">
                            <div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">Interactive Studio</span>
                                    <span className="px-2 py-0.5 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-full text-[10px] font-bold">
                                        TV Broadcast Director
                                    </span>
                                </div>
                                <h3 className="text-xl font-bold text-white tracking-tight mt-1">
                                    Clip #{clipIndex !== null ? clipIndex + 1 : 1} Director Preview & Fine-Tuning
                                </h3>
                                <p className="text-xs text-slate-400">
                                    Source: <code className="text-blue-400 font-mono">{videoName}</code> | Range: {clip.start.toFixed(1)}s – {clip.end.toFixed(1)}s ({(clip.end - clip.start).toFixed(1)}s)
                                </p>
                            </div>

                            <button
                                type="button"
                                onClick={onClose}
                                className="p-2 hover:bg-slate-800 text-slate-400 hover:text-white rounded-xl transition"
                            >
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-6 overflow-y-auto custom-scrollbar flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
                            {/* Left: Video Player, 9:16 Safe-Zone Mockup & Scrubbing (Col 7) */}
                            <div className="lg:col-span-7 space-y-4">
                                {/* Preview View Switcher */}
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-1 bg-slate-950 border border-slate-800 p-1 rounded-xl text-xs">
                                        <button
                                            type="button"
                                            onClick={() => setPreviewMode('phone')}
                                            className={`px-3 py-1 rounded-lg font-bold flex items-center gap-1.5 transition ${previewMode === 'phone' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            <Icon name="layout" className="w-3.5 h-3.5" />
                                            📱 9:16 Shorts Safe-Zone Inspector
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setPreviewMode('source')}
                                            className={`px-3 py-1 rounded-lg font-bold flex items-center gap-1.5 transition ${previewMode === 'source' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            <Icon name="video" className="w-3.5 h-3.5" />
                                            📹 16:9 Raw Source Scrub
                                        </button>
                                    </div>

                                    <span className="text-[11px] font-mono text-slate-400">
                                        {previewMode === 'phone' ? 'Live Mobile Simulation' : 'Source Frame Alignment'}
                                    </span>
                                </div>

                                {previewMode === 'phone' ? (
                                    /* Interactive 9:16 Smartphone Mockup with Real-time Title and Subtitle placement */
                                    <div className="w-64 max-w-[280px] aspect-[9/16] bg-black border-4 border-slate-700 rounded-3xl mx-auto relative overflow-hidden shadow-2xl flex flex-col justify-between select-none">
                                        <video
                                            ref={videoRef}
                                            src={`/inputs/${encodeURIComponent(videoName)}`}
                                            onTimeUpdate={handleTimeUpdate}
                                            onEnded={() => setIsPlaying(false)}
                                            className="absolute inset-0 w-full h-full object-cover"
                                        />

                                        {/* Real-time Title Pill Preview */}
                                        {showTitle && (
                                            <div
                                                className="absolute left-1/2 -translate-x-1/2 w-[86%] text-center text-[10px] font-black leading-tight px-3 py-1.5 rounded-lg bg-black/80 text-white border border-white/20 shadow-xl tracking-tight uppercase transition-all duration-150 z-20 pointer-events-none"
                                                style={{ top: `${(titleY / 1920) * 100}%` }}
                                            >
                                                {clip.hook_sentence || clip.title || 'HOOK HEADLINE BANNER'}
                                            </div>
                                        )}

                                        {/* Real-time Subtitles Preview */}
                                        <div
                                            className="absolute left-1/2 -translate-x-1/2 w-[90%] text-center text-xs font-black px-2 py-1 text-yellow-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)] uppercase tracking-wide transition-all duration-150 z-20 pointer-events-none"
                                            style={{ bottom: `${(marginV / 1920) * 100}%` }}
                                        >
                                            {isDual ? 'SPEAKER BANTER HERE' : 'VIRAL HOOK CAPTION'}
                                        </div>

                                        {/* Safe Zone Visual Overlays */}
                                        <div className="absolute top-0 left-0 right-0 h-[8%] border-b border-dashed border-red-500/40 pointer-events-none flex items-center justify-center">
                                            <span className="text-[8px] font-bold text-red-400/80 uppercase">Top Status UI</span>
                                        </div>
                                        <div className="absolute bottom-0 left-0 right-0 h-[15%] border-t border-dashed border-amber-500/40 pointer-events-none flex items-center justify-center">
                                            <span className="text-[8px] font-bold text-amber-400/80 uppercase">Bottom Description UI</span>
                                        </div>
                                        <div className="absolute top-[30%] bottom-[20%] right-0 w-[12%] border-l border-dashed border-cyan-500/40 pointer-events-none flex flex-col items-center justify-center gap-1">
                                            <span className="text-[7px] font-bold text-cyan-400/80 rotate-90">Platform Icons</span>
                                        </div>
                                    </div>
                                ) : (
                                    /* 16:9 Raw Source Video Box */
                                    <div className="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden relative aspect-video flex items-center justify-center shadow-inner">
                                        <video
                                            ref={videoRef}
                                            src={`/inputs/${encodeURIComponent(videoName)}`}
                                            onTimeUpdate={handleTimeUpdate}
                                            onEnded={() => setIsPlaying(false)}
                                            className="w-full h-full object-contain"
                                        />

                                        {/* Active Live Director Camera Badge */}
                                        <div className="absolute top-3 left-3 px-3 py-1 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-lg text-xs font-bold text-white flex items-center gap-2 shadow-lg">
                                            <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
                                            <span>
                                                {activeShot ? (
                                                    activeShot.type === 'split_stack' ? '9:8 Dual Split-Screen' :
                                                    activeShot.camera === 'zone_host' ? 'Solo Host (Zone 1)' :
                                                    activeShot.camera === 'zone_guest' ? 'Solo Guest (Zone 2)' :
                                                    activeShot.camera === 'zone_wide' ? 'Wide 2-Shot' :
                                                    `Angle: ${activeShot.camera}`
                                                ) : 'Director Live Cut'}
                                            </span>
                                        </div>
                                    </div>
                                )}

                                {/* Scrubber & In/Out Controls */}
                                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-3">
                                    <div className="space-y-1">
                                        <input
                                            type="range"
                                            min={clip.start}
                                            max={clip.end}
                                            step="0.1"
                                            value={currentTime}
                                            onChange={(e) => seekTo(parseFloat(e.target.value))}
                                            className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                        />
                                        <div className="flex justify-between text-[11px] font-mono text-slate-400">
                                            <span>In: {clip.start.toFixed(1)}s</span>
                                            <span className="text-blue-400 font-bold">{currentTime.toFixed(1)}s</span>
                                            <span>Out: {clip.end.toFixed(1)}s</span>
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between pt-1">
                                        <div className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                onClick={togglePlay}
                                                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 transition"
                                            >
                                                <Icon name={isPlaying ? "pause" : "play"} className="w-3.5 h-3.5" />
                                                {isPlaying ? "Pause" : "Play Clip"}
                                            </button>
                                        </div>

                                        <div className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                onClick={setInPoint}
                                                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1 border border-slate-700 transition"
                                                title="Set In Point to Current Time"
                                            >
                                                <Icon name="scissors" className="w-3 h-3 text-blue-400" />
                                                Set In (I)
                                            </button>
                                            <button
                                                type="button"
                                                onClick={setOutPoint}
                                                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1 border border-slate-700 transition"
                                                title="Set Out Point to Current Time"
                                            >
                                                <Icon name="scissors" className="w-3 h-3 text-blue-400" />
                                                Set Out (O)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Right: Fine-Tuning Controls (Col 5) */}
                            <div className="lg:col-span-5 space-y-4">
                                {/* Title Banner Configuration Card */}
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <label className="text-xs font-bold text-white flex items-center gap-1.5">
                                            <Icon name="type" className="w-3.5 h-3.5 text-blue-400" />
                                            Title Banner Pill
                                        </label>
                                        <label className="flex items-center gap-1.5 text-xs cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={showTitle}
                                                onChange={(e) => {
                                                    setShowTitle(e.target.checked);
                                                    onUpdateClipField('delete_title', !e.target.checked);
                                                }}
                                                className="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0"
                                            />
                                            <span className={showTitle ? 'text-blue-400 font-semibold text-[11px]' : 'text-slate-500 text-[11px]'}>
                                                {showTitle ? 'Active' : 'Hidden / Deleted'}
                                            </span>
                                        </label>
                                    </div>

                                    {showTitle && (
                                        <div className="space-y-3 pt-1">
                                            <input
                                                type="text"
                                                value={clip.hook_sentence || clip.title || ''}
                                                onChange={(e) => onUpdateClipField('hook_sentence', e.target.value)}
                                                placeholder="Enter hook headline..."
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition"
                                            />

                                            <div className="space-y-1">
                                                <div className="flex justify-between text-[11px] text-slate-400">
                                                    <span>Vertical Y Position:</span>
                                                    <span className="font-mono text-blue-400 font-bold">{titleY}px</span>
                                                </div>
                                                <input
                                                    type="range"
                                                    min="80"
                                                    max="320"
                                                    step="5"
                                                    value={titleY}
                                                    onChange={(e) => {
                                                        const val = parseInt(e.target.value);
                                                        setTitleY(val);
                                                        onUpdateClipField('title_y', val);
                                                    }}
                                                    className="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                                />
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Subtitle & Safe Zone Configuration Card */}
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h4 className="text-xs font-bold text-white tracking-tight flex items-center gap-1.5">
                                            <Icon name="sparkles" className="w-3.5 h-3.5 text-yellow-400" />
                                            Captions Position (MarginV)
                                        </h4>
                                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
                                            Auto-Bleep *** Active
                                        </span>
                                    </div>

                                    <div className="space-y-2 pt-1">
                                        <div className="flex justify-between text-[11px] text-slate-400">
                                            <span>Bottom Margin (Y distance):</span>
                                            <span className="font-mono text-yellow-400 font-bold">{marginV}px</span>
                                        </div>
                                        <input
                                            type="range"
                                            min="400"
                                            max="1100"
                                            step="10"
                                            value={marginV}
                                            onChange={(e) => {
                                                const val = parseInt(e.target.value);
                                                setMarginV(val);
                                                onUpdateClipField('margin_v', val);
                                            }}
                                            className="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-yellow-400"
                                        />

                                        <div className="flex items-center gap-2 pt-1">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setMarginV(960);
                                                    onUpdateClipField('margin_v', 960);
                                                }}
                                                className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition ${marginV === 960 ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'}`}
                                            >
                                                Center Seam (960px)
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setMarginV(580);
                                                    onUpdateClipField('margin_v', 580);
                                                }}
                                                className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition ${marginV === 580 ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'}`}
                                            >
                                                Lower Safe (580px)
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Virtual TV Director Cuts Timeline */}
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h4 className="text-xs font-bold text-white tracking-tight flex items-center gap-1.5">
                                            <Icon name="video" className="w-3.5 h-3.5 text-blue-400" />
                                            TV Director Shot Timeline
                                        </h4>
                                        <span className="text-[10px] text-slate-400 font-mono">
                                            {shots.length} camera cuts
                                        </span>
                                    </div>

                                    {isLoadingDirector ? (
                                        <div className="p-4 text-center text-xs text-slate-400 flex flex-col items-center justify-center gap-2">
                                            <Icon name="loader-2" className="w-5 h-5 text-blue-400 animate-spin" />
                                            <span>TV Director analyzing dialogue context...</span>
                                        </div>
                                    ) : shots.length === 0 ? (
                                        <div className="p-3 text-center text-xs text-slate-500 border border-dashed border-slate-800 rounded-xl">
                                            No director cuts planned yet.
                                        </div>
                                    ) : (
                                        <div className="space-y-1.5 max-h-[140px] overflow-y-auto custom-scrollbar pr-1">
                                            {shots.map((shot, sIdx) => {
                                                const shotDur = (shot.end - shot.start).toFixed(1);
                                                const isCurrent = activeShot === shot;
                                                return (
                                                    <div
                                                        key={sIdx}
                                                        onClick={() => seekTo(clip.start + shot.start)}
                                                        className={`p-2 rounded-xl border text-xs cursor-pointer transition flex items-center justify-between ${
                                                            isCurrent
                                                                ? 'bg-blue-600/20 border-blue-500 text-white font-semibold shadow-md'
                                                                : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:border-slate-700'
                                                        }`}
                                                    >
                                                        <div className="flex items-center gap-2">
                                                            <span className={`w-2 h-2 rounded-full ${
                                                                shot.type === 'split_stack' ? 'bg-purple-400' :
                                                                shot.camera === 'zone_host' ? 'bg-blue-400' :
                                                                shot.camera === 'zone_guest' ? 'bg-emerald-400' : 'bg-amber-400'
                                                            }`} />
                                                            <span className="text-[11px]">
                                                                {shot.type === 'split_stack' ? '9:8 Split Stack' :
                                                                 shot.camera === 'zone_host' ? 'Host Solo' :
                                                                 shot.camera === 'zone_guest' ? 'Guest Solo' :
                                                                 shot.camera === 'zone_wide' ? 'Wide 2-Shot' : shot.camera}
                                                            </span>
                                                        </div>
                                                        <span className="font-mono text-[10px] text-slate-400">
                                                            {shot.start.toFixed(1)}s - {shot.end.toFixed(1)}s ({shotDur}s)
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* Speed and Render Action */}
                                <div className="pt-1 space-y-3">
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-slate-400">Anti-Detection Speed:</span>
                                        <select
                                            value={renderSpeed}
                                            onChange={(e) => setRenderSpeed(parseFloat(e.target.value))}
                                            className="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-white font-mono text-xs focus:outline-none"
                                        >
                                            <option value={1.0}>1.0x (Normal)</option>
                                            <option value={1.08}>1.08x (Subtle)</option>
                                            <option value={1.10}>1.10x (Optimal Viral Retiming)</option>
                                            <option value={1.15}>1.15x (Fast)</option>
                                        </select>
                                    </div>

                                    <button
                                        type="button"
                                        onClick={() => onRenderApproved({ title_y: titleY, margin_v: marginV, delete_title: !showTitle })}
                                        disabled={isRenderingSingle}
                                        className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 transition active:scale-[0.99]"
                                    >
                                        {isRenderingSingle ? (
                                            <>
                                                <Icon name="loader-2" className="w-4 h-4 animate-spin" />
                                                Rendering Reel with NVENC...
                                            </>
                                        ) : (
                                            <>
                                                <Icon name="sparkles" className="w-4 h-4" />
                                                Approve & Render Reel (1080x1920)
                                            </>
                                        )}
                                    </button>

                                    {/* Finished Single Render Download Card */}
                                    {renderedClipResult && (
                                        <div className="p-3.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl space-y-2">
                                            <p className="text-xs font-bold text-emerald-300 flex items-center gap-1.5">
                                                <Icon name="check" className="w-4 h-4" />
                                                Render Completed Successfully!
                                            </p>
                                            <a
                                                href={renderedClipResult.download_url}
                                                download
                                                className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1.5 transition"
                                            >
                                                <Icon name="download" className="w-3.5 h-3.5" />
                                                Download {renderedClipResult.output_filename}
                                            </a>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
