<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.0 — Autonomous Viral Video Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2563eb',
                        accentHover: '#3b82f6',
                        darkBg: '#090d16',
                        cardBg: '#0f172a',
                        borderBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- React and ReactDOM UMD -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons Vanilla UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .canvas-container { width: 100% !important; height: 100% !important; max-width: 360px !important; aspect-ratio: 9/16 !important; margin: 0 auto !important; }
        .lower-canvas, .upper-canvas { width: 100% !important; height: 100% !important; object-fit: contain !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-[#090d16] text-zinc-100 min-h-screen overflow-x-hidden flex flex-col selection:bg-blue-600 selection:text-white font-sans">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Icon wrapper to integrate vanilla Lucide icons cleanly inside React virtual DOM
        const Icon = React.memo(({ name, className = "w-5 h-5" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className;
                    ref.current.appendChild(i);
                    window.lucide.createIcons();
                }
            }, [name, className]);

            return <span ref={ref} className="inline-flex items-center justify-center pointer-events-none" />;
        });

        // -------------------------------------------------------------------
        // Main Application Component
        // -------------------------------------------------------------------
        function App() {
            const [activeTab, setActiveTab] = useState('pipeline'); // 'pipeline' | 'canvas'

            // Dependencies State
            const [depsStatus, setDepsStatus] = useState(null);
            const [isCheckingDeps, setIsCheckingDeps] = useState(false);
            const [isInstallingDeps, setIsInstallingDeps] = useState(false);

            // Asset State
            const [videos, setVideos] = useState([]);
            const [logos, setLogos] = useState([]);
            const [selectedVideo, setSelectedVideo] = useState('');
            const [selectedLogo, setSelectedLogo] = useState('');
            const [remoteUrl, setRemoteUrl] = useState('');
            
            // Ingestion & Audio MD5 Cache State
            const [ingestData, setIngestData] = useState(null);
            const [isIngesting, setIsIngesting] = useState(false);

            // Loading Console State
            const [processId, setProcessId] = useState('');
            const [consoleLogs, setConsoleLogs] = useState([]);
            const [pipelineStage, setPipelineStage] = useState('idle');
            const [pipelineProgress, setPipelineProgress] = useState(0);

            // Curation State
            const [curatedClips, setCuratedClips] = useState([]);
            const [selectedClipIndices, setSelectedClipIndices] = useState([]);
            const [targetClipsCount, setTargetClipsCount] = useState(0);
            const [lowYieldWarning, setLowYieldWarning] = useState(false);
            const [yieldMessage, setYieldMessage] = useState('');
            const [isCurating, setIsCurating] = useState(false);

            // Batch Render State
            const [batchId, setBatchId] = useState('');
            const [batchStatus, setBatchStatus] = useState(null);
            const [isRenderingBatch, setIsRenderingBatch] = useState(false);
            const [renderSpeed, setRenderSpeed] = useState(1.12);

            // Fetch available assets and check dependencies on mount
            useEffect(() => {
                fetchAssets();
                checkDependencies(false);
            }, []);

            // Polling for Loading Console progress
            useEffect(() => {
                if (!processId || (!isIngesting && !isCurating)) return;
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/progress/${processId}`);
                        if (res.ok) {
                            const data = await res.json();
                            setConsoleLogs(data.logs || []);
                            setPipelineStage(data.stage || 'running');
                            setPipelineProgress(data.progress_pct || 0);
                            if (data.is_done) {
                                clearInterval(interval);
                            }
                        }
                    } catch (err) {
                        console.error("Progress poll error:", err);
                    }
                }, 700);
                return () => clearInterval(interval);
            }, [processId, isIngesting, isCurating]);

            // Polling for Batch Render progress
            useEffect(() => {
                if (!batchId || !isRenderingBatch) return;
                const interval = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/batch_status/${batchId}`);
                        if (res.ok) {
                            const data = await res.json();
                            setBatchStatus(data);
                            if (data.status === 'completed' || data.status === 'failed') {
                                setIsRenderingBatch(false);
                                clearInterval(interval);
                            }
                        }
                    } catch (err) {
                        console.error("Batch poll error:", err);
                    }
                }, 1500);
                return () => clearInterval(interval);
            }, [batchId, isRenderingBatch]);

            const fetchAssets = async () => {
                try {
                    const res = await fetch('/list_assets');
                    if (res.ok) {
                        const data = await res.json();
                        setVideos(data.videos || []);
                        setLogos(data.logos || []);
                        if (data.videos && data.videos.length > 0 && !selectedVideo) {
                            setSelectedVideo(data.videos[0]);
                        }
                    }
                } catch (e) {
                    console.error("Failed to fetch assets:", e);
                }
            };

            const checkDependencies = async (autoInstall = false) => {
                if (autoInstall) {
                    setIsInstallingDeps(true);
                    setConsoleLogs(prev => [...prev, `[${new Date().toLocaleTimeString()}] Initiating ECC dependency installation stream...`]);
                    setPipelineStage('dependencies');
                    setPipelineProgress(10);
                    try {
                        const eventSource = new EventSource('/api/dependencies/stream');
                        eventSource.onmessage = (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                if (data.output) {
                                    setConsoleLogs(prev => [...prev, data.output]);
                                } else if (data.message) {
                                    setConsoleLogs(prev => [...prev, `[DEPS] ${data.message}`]);
                                }
                                if (data.done) {
                                    eventSource.close();
                                    setIsInstallingDeps(false);
                                    setPipelineProgress(100);
                                    // Refresh status map
                                    fetch('/api/check_dependencies', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ auto_install: false })
                                    }).then(r => r.json()).then(setDepsStatus);
                                }
                            } catch (err) {
                                console.error("Error parsing dependency stream:", err);
                            }
                        };
                        eventSource.onerror = () => {
                            eventSource.close();
                            setIsInstallingDeps(false);
                        };
                    } catch (e) {
                        console.error("Stream connection error:", e);
                        setIsInstallingDeps(false);
                    }
                } else {
                    setIsCheckingDeps(true);
                    try {
                        const res = await fetch('/api/check_dependencies', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ auto_install: false })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            setDepsStatus(data);
                        }
                    } catch (e) {
                        console.error("Check dependencies error:", e);
                    } finally {
                        setIsCheckingDeps(false);
                    }
                }
            };

            const handleIngestAndCurate = async () => {
                const pid = 'p_' + Math.random().toString(36).substring(2, 9);
                setProcessId(pid);
                setConsoleLogs([`[${new Date().toLocaleTimeString()}] Initializing 2.0 Video Ingestion & Intelligence...`]);
                setPipelineProgress(5);
                setPipelineStage('ingestion');
                setIsIngesting(true);
                setCuratedClips([]);
                setSelectedClipIndices([]);
                setLowYieldWarning(false);
                setBatchStatus(null);
                setBatchId('');

                try {
                    // Step 1: Ingest (URL or local video)
                    const ingestPayload = remoteUrl.trim()
                        ? { url: remoteUrl.trim(), process_id: pid }
                        : { file_name: selectedVideo, process_id: pid };

                    const ingestRes = await fetch('/api/ingest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(ingestPayload)
                    });

                    if (!ingestRes.ok) {
                        const errData = await ingestRes.json();
                        throw new Error(errData.detail || 'Ingestion failed');
                    }

                    const ingestResult = await ingestRes.json();
                    setIngestData(ingestResult);
                    setSelectedVideo(ingestResult.file_name);
                    fetchAssets(); // Refresh video list
                    setIsIngesting(false);

                    // Step 2: High-Volume Curation Engine
                    setIsCurating(true);
                    setPipelineStage('curation');

                    const curateRes = await fetch('/api/curate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: ingestResult.file_name,
                            audio_md5: ingestResult.audio_md5,
                            process_id: pid,
                            min_score: 75
                        })
                    });

                    if (!curateRes.ok) {
                        const errData = await curateRes.json();
                        throw new Error(errData.detail || 'Curation failed');
                    }

                    const curateResult = await curateRes.json();
                    setCuratedClips(curateResult.clips || []);
                    setTargetClipsCount(curateResult.target_clips || 0);
                    setLowYieldWarning(curateResult.low_yield_warning || false);
                    setYieldMessage(curateResult.message || '');

                    // Auto-select Top 5 by default
                    const topIndices = (curateResult.clips || []).slice(0, 5).map((_, i) => i);
                    setSelectedClipIndices(topIndices);

                } catch (err) {
                    setConsoleLogs(prev => [...prev, `[ERROR] ${err.message}`]);
                    setPipelineStage('error');
                } finally {
                    setIsIngesting(false);
                    setIsCurating(false);
                }
            };

            const toggleClipSelection = (index) => {
                setSelectedClipIndices(prev => 
                    prev.includes(index) ? prev.filter(i => i !== index) : [...prev, index]
                );
            };

            const selectTopN = (n) => {
                const top = curatedClips.slice(0, n).map((_, i) => i);
                setSelectedClipIndices(top);
            };

            const selectHighVirality = (minScore = 80) => {
                const indices = [];
                curatedClips.forEach((c, i) => {
                    if ((c.virality_score || 0) >= minScore) indices.push(i);
                });
                setSelectedClipIndices(indices);
            };

            const handleStartBatchRender = async () => {
                if (selectedClipIndices.length === 0) return;
                const clipsToRender = selectedClipIndices.map(i => curatedClips[i]);
                setIsRenderingBatch(true);

                try {
                    const res = await fetch('/api/render_batch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            file_name: selectedVideo,
                            clips: clipsToRender,
                            speed: renderSpeed,
                            watermark_logo: selectedLogo || null,
                            brand_logo: selectedLogo || null,
                            aspect_ratio: '9:16'
                        })
                    });

                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || 'Batch submission failed');
                    }

                    const data = await res.json();
                    setBatchId(data.batch_id);
                } catch (err) {
                    alert(`Batch Render Error: ${err.message}`);
                    setIsRenderingBatch(false);
                }
            };

            return (
                <div className="min-h-screen w-full flex flex-col bg-[#090d16] text-white">
                    {/* Header Navbar */}
                    <header className="h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-xl tracking-tighter shadow-lg shadow-blue-500/20">
                                2.0
                            </div>
                            <div>
                                <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-2">
                                    Video Pipeline
                                    <span className="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                        Autonomous Studio
                                    </span>
                                </h1>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                            <button
                                onClick={() => setActiveTab('pipeline')}
                                className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                                    activeTab === 'pipeline' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <Icon name="sparkles" className="w-3.5 h-3.5" />
                                AI Curation Pipeline
                            </button>
                            <button
                                onClick={() => setActiveTab('canvas')}
                                className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition ${
                                    activeTab === 'canvas' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                <Icon name="crop" className="w-3.5 h-3.5" />
                                Canvas Editor
                            </button>
                        </div>

                        {/* Dependency Status Indicator */}
                        <div className="flex items-center gap-3">
                            {depsStatus && (
                                <div className="flex items-center gap-2 text-xs">
                                    <span className={`w-2 h-2 rounded-full ${depsStatus.all_installed ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                    <span className="text-slate-400">
                                        {depsStatus.all_installed ? 'Engines Ready' : `${depsStatus.missing.length} Deps Missing`}
                                    </span>
                                    {!depsStatus.all_installed && (
                                        <button
                                            onClick={() => checkDependencies(true)}
                                            disabled={isInstallingDeps}
                                            className="px-2 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded text-[11px] font-medium transition"
                                        >
                                            {isInstallingDeps ? 'Installing...' : 'Auto-Install'}
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 p-6 max-w-7xl w-full mx-auto flex flex-col gap-6">
                        {activeTab === 'pipeline' ? (
                            <PipelineTabContent
                                remoteUrl={remoteUrl}
                                setRemoteUrl={setRemoteUrl}
                                videos={videos}
                                selectedVideo={selectedVideo}
                                setSelectedVideo={setSelectedVideo}
                                logos={logos}
                                selectedLogo={selectedLogo}
                                setSelectedLogo={setSelectedLogo}
                                isIngesting={isIngesting}
                                isCurating={isCurating}
                                handleIngestAndCurate={handleIngestAndCurate}
                                ingestData={ingestData}
                                consoleLogs={consoleLogs}
                                pipelineStage={pipelineStage}
                                pipelineProgress={pipelineProgress}
                                curatedClips={curatedClips}
                                selectedClipIndices={selectedClipIndices}
                                toggleClipSelection={toggleClipSelection}
                                selectTopN={selectTopN}
                                selectHighVirality={selectHighVirality}
                                targetClipsCount={targetClipsCount}
                                lowYieldWarning={lowYieldWarning}
                                yieldMessage={yieldMessage}
                                renderSpeed={renderSpeed}
                                setRenderSpeed={setRenderSpeed}
                                handleStartBatchRender={handleStartBatchRender}
                                isRenderingBatch={isRenderingBatch}
                                batchStatus={batchStatus}
                                batchId={batchId}
                                depsStatus={depsStatus}
                                onCheckDeps={() => checkDependencies(false)}
                                onInstallDeps={() => checkDependencies(true)}
                                isInstallingDeps={isInstallingDeps}
                            />
                        ) : (
                            <CanvasRebranderTabContent
                                videos={videos}
                                logos={logos}
                                selectedLogo={selectedLogo}
                                setSelectedLogo={setSelectedLogo}
                            />
                        )}
                    </main>
                </div>
            );
        }

        // -------------------------------------------------------------------
        // Pipeline Tab Component (Phase 1 to Phase 4)
        // -------------------------------------------------------------------
        function PipelineTabContent({
            remoteUrl, setRemoteUrl,
            videos, selectedVideo, setSelectedVideo,
            logos, selectedLogo, setSelectedLogo,
            isIngesting, isCurating, handleIngestAndCurate,
            ingestData, consoleLogs, pipelineStage, pipelineProgress,
            curatedClips, selectedClipIndices, toggleClipSelection,
            selectTopN, selectHighVirality,
            targetClipsCount, lowYieldWarning, yieldMessage,
            renderSpeed, setRenderSpeed,
            handleStartBatchRender, isRenderingBatch, batchStatus, batchId,
            depsStatus, onCheckDeps, onInstallDeps, isInstallingDeps
        }) {
            const consoleBottomRef = useRef(null);

            useEffect(() => {
                if (consoleBottomRef.current) {
                    consoleBottomRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [consoleLogs]);

            return (
                <div className="space-y-8">
                    {/* Stage 1: Smart Ingestion & Dependency Control */}
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                        <div className="flex items-center justify-between mb-4">
                            <div>
                                <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">Phase 1</span>
                                <h2 className="text-xl font-bold text-white tracking-tight">Smart Ingestion & Cache Interceptor</h2>
                            </div>
                            {ingestData && (
                                <div className="flex items-center gap-2 px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs">
                                    <span className="text-slate-400">Audio MD5:</span>
                                    <code className="text-blue-400 font-mono">{ingestData.audio_md5 ? ingestData.audio_md5.substring(0, 12) + '...' : 'N/A'}</code>
                                    {ingestData.cache_hit ? (
                                        <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded text-[10px] font-bold">
                                            CACHE HIT
                                        </span>
                                    ) : (
                                        <span className="px-2 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] font-bold">
                                            FRESH RUN
                                        </span>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {/* URL Ingestion */}
                            <div className="space-y-2">
                                <label className="block text-xs font-semibold text-slate-300">
                                    YouTube / Google Drive URL
                                </label>
                                <div className="relative">
                                    <input
                                        type="text"
                                        placeholder="https://youtube.com/watch?v=... or Drive URL"
                                        value={remoteUrl}
                                        onChange={(e) => setRemoteUrl(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
                                    />
                                </div>
                                <p className="text-[11px] text-slate-500">Auto-downloaded via yt-dlp / gdown</p>
                            </div>

                            {/* Local Ingestion */}
                            <div className="space-y-2">
                                <label className="block text-xs font-semibold text-slate-300">
                                    Or Select Local Video (inputs/)
                                </label>
                                <select
                                    value={selectedVideo}
                                    onChange={(e) => setSelectedVideo(e.target.value)}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition cursor-pointer"
                                >
                                    {videos.length === 0 && <option value="">No local videos found</option>}
                                    {videos.map(v => (
                                        <option key={v} value={v}>{v}</option>
                                    ))}
                                </select>
                                <p className="text-[11px] text-slate-500">{videos.length} videos detected in inputs directory</p>
                            </div>

                            {/* Action CTA */}
                            <div className="flex flex-col justify-end">
                                <button
                                    onClick={handleIngestAndCurate}
                                    disabled={isIngesting || isCurating || (!remoteUrl.trim() && !selectedVideo)}
                                    className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 transition active:scale-[0.99]"
                                >
                                    {isIngesting ? (
                                        <>
                                            <Icon name="loader-2" className="w-4 h-4 animate-spin" />
                                            Ingesting Media...
                                        </>
                                    ) : isCurating ? (
                                        <>
                                            <Icon name="sparkles" className="w-4 h-4 animate-spin" />
                                            Curating Viral Moments...
                                        </>
                                    ) : (
                                        <>
                                            <Icon name="play" className="w-4 h-4" />
                                            Run High-Volume Pipeline
                                        </>
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Stage 2: Real-time Loading Console */}
                    {(isIngesting || isCurating || consoleLogs.length > 0) && (
                        <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="flex gap-1.5">
                                        <span className="w-3 h-3 rounded-full bg-red-500/80"></span>
                                        <span className="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                                        <span className="w-3 h-3 rounded-full bg-green-500/80"></span>
                                    </div>
                                    <span className="text-xs font-mono font-bold text-slate-400 ml-2">TERMINAL LOGS // {pipelineStage.toUpperCase()}</span>
                                </div>
                                <span className="text-xs font-mono font-bold text-blue-400">{pipelineProgress}% COMPLETE</span>
                            </div>

                            {/* Progress bar */}
                            <div className="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500 ease-out"
                                    style={{ width: `${pipelineProgress}%` }}
                                ></div>
                            </div>

                            {/* Console output box */}
                            <div className="h-44 overflow-y-auto bg-[#070b14] border border-slate-900 rounded-xl p-4 font-mono text-xs text-slate-300 space-y-1 custom-scrollbar">
                                {consoleLogs.map((log, idx) => (
                                    <div key={idx} className="leading-relaxed">
                                        {log.includes('ERROR') ? (
                                            <span className="text-red-400">{log}</span>
                                        ) : log.includes('HIT') ? (
                                            <span className="text-emerald-400 font-semibold">{log}</span>
                                        ) : (
                                            <span className="text-slate-300">{log}</span>
                                        )}
                                    </div>
                                ))}
                                <div ref={consoleBottomRef} />
                            </div>
                        </div>
                    )}

                    {/* Stage 3: Review Gallery (Curation Results) */}
                    {curatedClips.length > 0 && (
                        <div className="space-y-4">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">Phase 2</span>
                                        <span className="text-xs text-slate-400 font-medium">({curatedClips.length} clips curated | Target: {targetClipsCount})</span>
                                    </div>
                                    <h2 className="text-xl font-bold text-white tracking-tight">Review Gallery</h2>
                                </div>

                                {/* Quick selection toolbar */}
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-xs text-slate-400 mr-1">Auto-Select:</span>
                                    <button
                                        onClick={() => selectTopN(5)}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition"
                                    >
                                        Top 5
                                    </button>
                                    <button
                                        onClick={() => selectTopN(10)}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition"
                                    >
                                        Top 10
                                    </button>
                                    <button
                                        onClick={() => selectHighVirality(80)}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition"
                                    >
                                        Score ≥ 80
                                    </button>
                                    <button
                                        onClick={() => setSelectedClipIndices(curatedClips.map((_, i) => i))}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition"
                                    >
                                        Select All
                                    </button>
                                    <button
                                        onClick={() => setSelectedClipIndices([])}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition"
                                    >
                                        Clear
                                    </button>
                                </div>
                            </div>

                            {/* Low yield warning alert */}
                            {lowYieldWarning && (
                                <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 flex items-start gap-3 text-amber-200 text-sm">
                                    <Icon name="alert-triangle" className="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <p className="font-bold">Quality Fallback Notice</p>
                                        <p className="text-xs text-amber-300/90 mt-1">{yieldMessage}</p>
                                    </div>
                                </div>
                            )}

                            {/* Clips Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {curatedClips.map((clip, index) => {
                                    const isSelected = selectedClipIndices.includes(index);
                                    const duration = (clip.end - clip.start).toFixed(1);
                                    const score = clip.virality_score || 85;
                                    const scoreColor = score >= 90 ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' :
                                                       score >= 80 ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' :
                                                       'bg-amber-500/20 text-amber-400 border-amber-500/30';

                                    return (
                                        <div
                                            key={index}
                                            onClick={() => toggleClipSelection(index)}
                                            className={`p-5 rounded-2xl border transition-all cursor-pointer select-none flex flex-col justify-between gap-4 ${
                                                isSelected 
                                                    ? 'bg-slate-900 border-blue-500 shadow-lg shadow-blue-500/10' 
                                                    : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'
                                            }`}
                                        >
                                            <div className="space-y-3">
                                                <div className="flex items-center justify-between gap-2">
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${scoreColor}`}>
                                                        Viral Score {score}
                                                    </span>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-[11px] text-slate-400 font-mono">
                                                            {clip.start.toFixed(1)}s – {clip.end.toFixed(1)}s ({duration}s)
                                                        </span>
                                                        <input
                                                            type="checkbox"
                                                            checked={isSelected}
                                                            onChange={() => {}}
                                                            className="w-4 h-4 rounded text-blue-600 bg-slate-950 border-slate-700 focus:ring-0 cursor-pointer"
                                                        />
                                                    </div>
                                                </div>

                                                <h3 className="font-bold text-white text-base leading-snug line-clamp-2">
                                                    {clip.hook_sentence || clip.title || `Clip #${index + 1}`}
                                                </h3>

                                                <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed">
                                                    {clip.reason || clip.virality_reason || 'Identified high-impact dialogue segment.'}
                                                </p>
                                            </div>

                                            <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                                                <span>9:16 Vertical Video</span>
                                                <span className="text-blue-400 font-medium">Kinetic Subtitles ASS</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Batch Render Control Bar */}
                            <div className="sticky bottom-6 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-2xl p-5 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4 z-40">
                                <div className="flex items-center gap-4">
                                    <span className="text-sm font-bold text-white">
                                        Selected: <span className="text-blue-400 font-mono text-base">{selectedClipIndices.length}</span> of {curatedClips.length} clips
                                    </span>

                                    {/* Speed Factor */}
                                    <div className="flex items-center gap-2 text-xs">
                                        <span className="text-slate-400">Anti-Detection Speed:</span>
                                        <select
                                            value={renderSpeed}
                                            onChange={(e) => setRenderSpeed(parseFloat(e.target.value))}
                                            className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white font-mono text-xs focus:outline-none"
                                        >
                                            <option value={1.0}>1.0x (Normal)</option>
                                            <option value={1.08}>1.08x (Subtle)</option>
                                            <option value={1.12}>1.12x (Standard)</option>
                                            <option value={1.15}>1.15x (Fast)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="flex items-center gap-3 w-full md:w-auto">
                                    <button
                                        onClick={handleStartBatchRender}
                                        disabled={isRenderingBatch || selectedClipIndices.length === 0}
                                        className="w-full md:w-auto px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 transition active:scale-[0.99]"
                                    >
                                        {isRenderingBatch ? (
                                            <>
                                                <Icon name="loader-2" className="w-4 h-4 animate-spin" />
                                                Rendering Batch...
                                            </>
                                        ) : (
                                            <>
                                                <Icon name="video" className="w-4 h-4" />
                                                Render Selected Clips ({selectedClipIndices.length})
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Stage 4: Batch Status & ZIP Export */}
                    {batchStatus && (
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">Phase 4</span>
                                    <h2 className="text-xl font-bold text-white tracking-tight">Batch Render & Export</h2>
                                    <p className="text-xs text-slate-400 mt-1">
                                        Batch ID: <code className="text-blue-400 font-mono">{batchId}</code> | Status: <span className="font-semibold text-white capitalize">{batchStatus.status}</span>
                                    </p>
                                </div>

                                {batchStatus.completed > 0 && (
                                    <a
                                        href={`/api/download_zip/${batchId}`}
                                        download="final_reels.zip"
                                        className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition"
                                    >
                                        <Icon name="download" className="w-4 h-4" />
                                        Download final_reels.zip ({batchStatus.completed} clips)
                                    </a>
                                )}
                            </div>

                            {/* Batch progress */}
                            <div className="space-y-2">
                                <div className="flex justify-between text-xs text-slate-400">
                                    <span>Rendering Progress: {batchStatus.completed} / {batchStatus.total} Completed</span>
                                    <span className="font-mono font-bold text-white">{batchStatus.progress_pct}%</span>
                                </div>
                                <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                                    <div
                                        className="h-full bg-emerald-500 transition-all duration-500"
                                        style={{ width: `${batchStatus.progress_pct}%` }}
                                    ></div>
                                </div>
                            </div>

                            {/* Finished Clips Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {batchStatus.jobs.map((job, idx) => (
                                    <div key={job.job_id} className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold text-white">Clip #{idx + 1}</span>
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                                job.status === 'completed' ? 'bg-emerald-500/20 text-emerald-300' :
                                                job.status === 'processing' ? 'bg-blue-500/20 text-blue-300 animate-pulse' :
                                                job.status === 'failed' ? 'bg-red-500/20 text-red-300' : 'bg-slate-800 text-slate-400'
                                            }`}>
                                                {job.status}
                                            </span>
                                        </div>

                                        {job.status === 'completed' && job.result && (
                                            <div className="space-y-3">
                                                <video
                                                    src={job.result.download_url}
                                                    controls
                                                    className="w-full max-h-48 rounded-lg bg-black object-contain"
                                                />
                                                <a
                                                    href={job.result.download_url}
                                                    download
                                                    className="block w-full py-2 bg-slate-800 hover:bg-slate-700 text-center text-xs font-semibold text-white rounded-lg transition"
                                                >
                                                    Download MP4
                                                </a>
                                            </div>
                                        )}

                                        {job.status === 'failed' && (
                                            <p className="text-xs text-red-400">{job.error || 'Rendering encountered an error'}</p>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // -------------------------------------------------------------------
        // Canvas Rebrander Tab Component (Fabric.js Manual Studio)
        // -------------------------------------------------------------------
        function CanvasRebranderTabContent({ videos, logos, selectedLogo, setSelectedLogo }) {
            const canvasRef = useRef(null);
            const [activeVideo, setActiveVideo] = useState(videos.length > 0 ? videos[0] : '');

            return (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6">
                    <div>
                        <span className="text-xs font-bold tracking-widest text-blue-400 uppercase">Interactive Studio</span>
                        <h2 className="text-2xl font-bold text-white tracking-tight">Canvas Rebrander & Visual Editor</h2>
                        <p className="text-sm text-slate-400 mt-1">
                            Fine-tune layout bounding boxes, watermark positioning, and custom overlays visually.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Canvas preview */}
                        <div className="lg:col-span-1 flex flex-col items-center justify-center p-4 bg-slate-950 rounded-2xl border border-slate-800">
                            <div className="w-full max-w-[280px] aspect-[9/16] bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center border-2 border-blue-500/30 shadow-xl">
                                {activeVideo ? (
                                    <img
                                        src={`/get_frame?video=${encodeURIComponent(activeVideo)}`}
                                        alt="Video Frame"
                                        className="w-full h-full object-cover"
                                    />
                                ) : (
                                    <span className="text-xs text-slate-500">Select a video to preview</span>
                                )}
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="lg:col-span-2 space-y-4">
                            <div className="space-y-2">
                                <label className="block text-xs font-semibold text-slate-300">Active Video Selection</label>
                                <select
                                    value={activeVideo}
                                    onChange={(e) => setActiveVideo(e.target.value)}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none"
                                >
                                    {videos.map(v => (
                                        <option key={v} value={v}>{v}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="space-y-2">
                                <label className="block text-xs font-semibold text-slate-300">Watermark / Logo Preset</label>
                                <select
                                    value={selectedLogo}
                                    onChange={(e) => setSelectedLogo(e.target.value)}
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none"
                                >
                                    <option value="">No logo</option>
                                    {logos.map(l => (
                                        <option key={l} value={l}>{l}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-xs text-slate-400">
                                <p className="font-semibold text-white">Opus-Level Automation Note:</p>
                                <p>
                                    The automated AI Pipeline handles dynamic speaker tracking, kinetic ASS karaoke subtitles, and 30s-50s clip curation automatically. Use the AI Curation Pipeline tab for complete 1-click batch generation.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
